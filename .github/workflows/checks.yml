name: Infrastructure checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, infra, eks]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=${{ matrix.stack }} fmt -check
      - run: terraform -chdir=${{ matrix.stack }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.stack }} validate
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
