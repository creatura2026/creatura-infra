name: Deploy Creatura AWS

on:
  push:
    branches: [develop]

  workflow_dispatch:
    inputs:
      app_run_id:
        description: "Successful develop app CI run ID (empty = latest successful push CI)"
        required: false
        type: string
      app_run_attempt:
        description: "Exact app run attempt (empty = selected run current attempt)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: creatura-aws-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    env:
      GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'eu-north-1' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'creatura-infra/terraform.tfstate' }}
      TF_EKS_STATE_KEY: ${{ vars.TF_EKS_STATE_KEY || 'eks/terraform.tfstate' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'creatura-backend' }}
      EKS_KUBERNETES_VERSION: ${{ vars.EKS_KUBERNETES_VERSION }}
      EKS_ADMIN_PRINCIPAL_ARN: ${{ vars.EKS_ADMIN_PRINCIPAL_ARN }}
      EKS_ADMIN_CIDRS: ${{ vars.EKS_ADMIN_CIDRS || '[]' }}
      # Pare-feu WAF devant CloudFront (infra/waf.tf) : désactivé tant que la variable n'est pas à true.
      WAF_ENABLED: ${{ vars.WAF_ENABLED || 'false' }}
      WAF_MODE: ${{ vars.WAF_MODE || 'block' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_PAGER: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest renderer
        run: python -m pip install PyYAML==6.0.2

      - name: Select and wait for app CI
        env:
          REQUESTED_RUN: ${{ inputs.app_run_id }}
          REQUESTED_ATTEMPT: ${{ inputs.app_run_attempt }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

          run_id="$REQUESTED_RUN"

          if [ -z "$run_id" ]; then
            run_id=$(gh api \
              'repos/creatura2026/creatura-app/actions/workflows/ci.yml/runs?branch=develop&event=push&status=success&per_page=1' \
              --jq '.workflow_runs[0].id')
          fi

          [[ "$run_id" =~ ^[0-9]+$ ]]

          for _ in $(seq 1 160); do
            gh api \
              "repos/creatura2026/creatura-app/actions/runs/$run_id" \
              > /tmp/app-run.json

            [ "$(jq -r .status /tmp/app-run.json)" = completed ] && break
            sleep 15
          done

          jq -e '
            .status == "completed"
            and .conclusion == "success"
            and .event == "push"
            and .head_branch == "develop"
            and .path == ".github/workflows/ci.yml"
            and .head_repository.full_name == "creatura2026/creatura-app"
          ' /tmp/app-run.json > /dev/null

          attempt=$(jq -r '.run_attempt' /tmp/app-run.json)
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]

          if [ -n "$REQUESTED_ATTEMPT" ]; then
            test "$attempt" = "$REQUESTED_ATTEMPT"
          fi

          echo "APP_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "APP_RUN_ATTEMPT=$attempt" >> "$GITHUB_ENV"

      - name: Download exact release manifest
        uses: actions/download-artifact@v4
        with:
          repository: creatura2026/creatura-app
          run-id: ${{ env.APP_RUN_ID }}
          github-token: ${{ secrets.APP_REPO_TOKEN }}
          name: creatura-release-${{ env.APP_RUN_ID }}-${{ env.APP_RUN_ATTEMPT }}
          path: .deploy/release

      - name: Validate app release
        run: |
          python scripts/ci/verify-release.py \
            /tmp/app-run.json \
            .deploy/release/release.json

      - name: Download exact frontend build
        uses: actions/download-artifact@v4
        with:
          repository: creatura2026/creatura-app
          run-id: ${{ env.APP_RUN_ID }}
          github-token: ${{ secrets.APP_REPO_TOKEN }}
          name: frontend-dist-${{ env.APP_RUN_ID }}-${{ env.APP_RUN_ATTEMPT }}
          path: .deploy/frontend

      - name: Verify exact frontend bytes and unpack
        run: |
          python scripts/ci/unpack-frontend.py \
            .deploy/release/release.json \
            .deploy/frontend/frontend.tar.gz \
            .deploy/site

      - name: Verify pinned GHCR images exist
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: bash scripts/ci/check-ghcr.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Configure Terraform and check account
        run: bash scripts/ci/configure-aws.sh

      - name: Reject older app release
        run: |
          set -euo pipefail

          terraform -chdir=infra output -json > /tmp/infra-outputs.json
          bucket=$(jq -r '.bucket_name.value // empty' /tmp/infra-outputs.json)

          if [ -z "$bucket" ]; then
            echo "First deployment: no application bucket output yet."
            exit 0
          fi

          for marker in release deployment; do
            aws s3api list-objects-v2 \
              --bucket "$bucket" \
              --prefix ".creatura/$marker.json" \
              --output json > /tmp/release-objects.json

            if jq -e --arg key ".creatura/$marker.json" \
              '(.Contents // []) | any(.Key == $key)' \
              /tmp/release-objects.json > /dev/null; then

              aws s3 cp \
                "s3://$bucket/.creatura/$marker.json" \
                /tmp/current-release.json \
                --only-show-errors

              python scripts/ci/check-release-order.py \
                /tmp/current-release.json \
                .deploy/release/release.json
            fi
          done

      - name: Provision EKS, RDS, ALB and CDN
        run: bash scripts/ci/provision.sh

      - name: Determine kubectl version matching EKS
        run: |
          set -euo pipefail

          version=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --query cluster.version \
            --output text)

          [[ "$version" =~ ^1\.[0-9]+$ ]]
          echo "KUBECTL_VERSION=$version" >> "$GITHUB_ENV"

      - uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBECTL_VERSION }}.0

      - name: Schema, backend and frontend release
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
        run: bash scripts/ci/deploy-release.sh

      - name: Deployment summary
        if: success()
        run: |
          echo "Infrastructure commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "App CI: https://github.com/creatura2026/creatura-app/actions/runs/$APP_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=infra output -raw site_url >> "$GITHUB_STEP_SUMMARY"