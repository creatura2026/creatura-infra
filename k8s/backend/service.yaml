apiVersion: v1
kind: Service
metadata:
  name: creatura-backend
  namespace: creatura
spec:
  # NodePort fixe : sur EKS, l'ALB de eks/api.tf le vise sur chaque nœud ;
  # en local, kind le publie sur http://localhost:30080.
  type: NodePort
  selector:
    app: creatura-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
