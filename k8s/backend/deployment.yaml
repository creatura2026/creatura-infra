apiVersion: apps/v1
kind: Deployment
metadata:
  name: creatura-backend
  namespace: creatura
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: creatura-backend
  template:
    metadata:
      labels:
        app: creatura-backend
    spec:
      serviceAccountName: creatura-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: IMAGE_REQUIRED
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - secretRef:
            name: creatura-backend
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        # Laisse au Service et à l'ALB le temps de retirer le pod avant l'arrêt d'uvicorn :
        # sans cette pause, quelques requêtes échouent à chaque remplacement de pod.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
        livenessProbe:
          periodSeconds: 10
          failureThreshold: 3
          tcpSocket:
            port: http
